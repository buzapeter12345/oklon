<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Omegle Mobile - Modern UI</title>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; 
        }
        
        body { 
            background: radial-gradient(circle at center, #1a1a2e 0%, #0d0d14 100%); /* Finom, sötétkék mozihatás */
            color: white; 
            display: flex; 
            flex-direction: column; 
            height: 100vh;
            height: -webkit-fill-available;
            overflow: hidden;
            position: relative;
        }

        html {
            height: -webkit-fill-available;
        }

        /* Kamera engedélykérő panel */
        #permission-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(13, 13, 20, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 30px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        #permission-overlay h2 { color: #ff6b6b; margin-bottom: 15px; font-size: 28px; font-weight: 800; letter-spacing: -1px; }
        #permission-overlay p { color: #aaa; margin-bottom: 35px; font-size: 16px; line-height: 1.6; max-width: 320px; }
        
        #grant-camera-btn {
            background: linear-gradient(135deg, #ff6b6b 0%, #ff4757 100%);
            color: white;
            padding: 18px 40px;
            font-size: 17px;
            border-radius: 50px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 25px rgba(255, 107, 107, 0.5);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        #grant-camera-btn:active {
            transform: translateY(2px);
            box-shadow: 0 3px 15px rgba(255, 107, 107, 0.5);
        }
        
        /* Fő tartalom */
        #main-container { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden;
            padding-bottom: 90px; /* Hely a lebegő input-sávnak */
        }
        
        /* Videók szekciója */
        #video-container { 
            height: 60vh; /* Megemelt magasság */
            display: flex;
            flex-direction: column; 
            gap: 4px;
            background: #000;
            flex-shrink: 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .video-wrapper {
            flex: 1;
            position: relative;
            background: #111;
            overflow: hidden;
            border-radius: 4px;
        }
        
        video { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; /* Tökéletes kitöltés, nincs torzulás */
        }

        #local-video { 
            transform: scaleX(-1); 
        }

        .video-label {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            backdrop-filter: blur(5px);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: rgba(255,255,255,0.9);
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        /* Chat szekció */
        #chat-container { 
            flex: 1; 
            background: transparent; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden;
            padding: 10px 10px 0 10px;
        }

        #chat-box { 
            flex: 1; 
            padding: 10px; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 10px;
            -webkit-overflow-scrolling: touch; 
        }

        .msg { 
            padding: 12px 16px; 
            border-radius: 18px; 
            max-width: 80%; 
            font-size: 15px; 
            line-height: 1.5;
            word-break: break-word;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .msg.status { 
            background: rgba(255, 255, 255, 0.03); 
            color: #999; 
            align-self: center; 
            font-size: 13px;
            border-radius: 20px;
            padding: 8px 16px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .msg.me { 
            background: #007acc; 
            color: white;
            align-self: flex-end; 
            border-bottom-right-radius: 4px;
        }

        .msg.stranger { 
            background: rgba(255, 255, 255, 0.07); 
            color: #eee;
            align-self: flex-start; 
            border-bottom-left-radius: 4px;
        }
        
        /* Lebegő Modern Input sáv */
        #input-area { 
            position: absolute;
            bottom: 15px;
            left: 15px;
            right: 15px;
            padding: 10px; 
            background: rgba(30, 30, 35, 0.75); 
            display: flex; 
            gap: 10px; 
            align-items: center;
            border-radius: 50px;
            backdrop-filter: blur(15px); /* Üveghatás */
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            z-index: 100;
            transition: transform 0.3s ease;
        }

        /* Amikor a billentyűzet felugrik, emeljük meg */
        body.keyboard-open #input-area {
            transform: translateY(-260px); /* Tipp: ezt JS-ből érdemes pontosan számolni */
        }

        input { 
            flex: 1; 
            padding: 14px 20px; 
            border-radius: 30px; 
            border: none; 
            background: rgba(255, 255, 255, 0.06); 
            color: white; 
            font-size: 16px; 
            outline: none;
            transition: background 0.2s;
        }
        
        input:focus {
            background: rgba(255, 255, 255, 0.1);
        }

        input::placeholder {
            color: rgba(255,255,255,0.4);
        }

        button { 
            padding: 14px 22px; 
            border: none; 
            border-radius: 30px; 
            font-weight: 700; 
            cursor: pointer;
            font-size: 15px;
            transition: opacity 0.2s, transform 0.1s;
        }
        
        button:active {
            transform: scale(0.96);
        }

        #next-btn { 
            background: rgba(255, 59, 48, 0.15); 
            color: #ff3b30; 
            border: 1px solid rgba(255, 59, 48, 0.3);
        }
        
        #next-btn:hover {
            background: rgba(255, 59, 48, 0.25);
        }

        #send-btn { 
            background: #34c759; 
            color: white; 
        }
        
        #send-btn:disabled { 
            background: rgba(52, 199, 89, 0.2); 
            color: rgba(255,255,255,0.3); 
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div id="permission-overlay">
        <h2>Anonim Videó</h2>
        <p>A kezdéshez engedélyezned kell a kamerát és a mikrofont.</p>
        <button id="grant-camera-btn">Kamera indítása 📹</button>
    </div>

    <div id="main-container">
        <div id="video-container">
            <div class="video-wrapper">
                <video id="remote-video" autoplay playsinline></video>
                <div class="video-label">Idegen</div>
            </div>
            <div class="video-wrapper">
                <video id="local-video" autoplay muted playsinline></video>
                <div class="video-label">Te</div>
            </div>
        </div>

        <div id="chat-container">
            <div id="chat-box"></div>
        </div>
    </div>

    <div id="input-area">
        <button id="next-btn">Next</button>
        <input type="text" id="msg-input" placeholder="Írj egy üzenetet..." disabled autocomplete="off">
        <button id="send-btn" disabled>Küldés</button>
    </div>

    <script>
        // ... (A korábbi JavaScript kódod változatlan marad) ...

        // Egy kis JS trükk a billentyűzet felugrásának detektálására mobilon
        const inputField = document.getElementById('msg-input');
        inputField.addEventListener('focus', () => {
            document.body.classList.add('keyboard-open');
        });
        inputField.addEventListener('blur', () => {
            document.body.classList.remove('keyboard-open');
        });
    </script>
</body>
</html>
