<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Omegle Mobile</title>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
        }
        
        body { 
            background: #000; 
            color: white; 
            display: flex; 
            flex-direction: column; 
            height: 100vh;
            height: -webkit-fill-available;
            overflow: hidden;
        }

        html {
            height: -webkit-fill-available;
        }

        /* Kamera engedélykérő full-screen panel */
        #permission-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #111;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 30px;
            text-align: center;
        }

        #permission-overlay h2 { color: #ff6b6b; margin-bottom: 15px; font-size: 24px; }
        #permission-overlay p { color: #aaa; margin-bottom: 30px; font-size: 15px; line-height: 1.6; max-width: 280px; }
        
        #grant-camera-btn {
            background: #ff6b6b;
            color: white;
            padding: 18px 36px;
            font-size: 16px;
            border-radius: 50px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(255, 107, 107, 0.4);
        }
        
        #main-container { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden;
        }
        
        /* Videók szekciója: függőlegesen felezik a képernyő felső részét */
        #video-container { 
            height: 55vh; 
            display: flex;
            flex-direction: column; 
            gap: 2px;
            background: #000;
            flex-shrink: 0;
        }

        .video-wrapper {
            flex: 1;
            position: relative;
            background: #1a1a1a;
            overflow: hidden;
        }
        
        video { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
        }

        #local-video { 
            transform: scaleX(-1); 
        }

        .video-label {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.6);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            backdrop-filter: blur(5px);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        /* Chat szekció az alsó felen */
        #chat-container { 
            flex: 1; 
            background: #141416; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden;
        }

        #chat-box { 
            flex: 1; 
            padding: 15px; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 8px;
            -webkit-overflow-scrolling: touch; 
        }

        .msg { 
            padding: 10px 14px; 
            border-radius: 16px; 
            max-width: 80%; 
            font-size: 15px; 
            line-height: 1.4;
            word-break: break-word;
        }

        .msg.status { 
            background: rgba(255, 255, 255, 0.05); 
            color: #bbb; 
            align-self: center; 
            font-size: 13px;
            border-radius: 20px;
            padding: 6px 14px;
            text-align: center;
        }

        .msg.me { 
            background: #007acc; 
            align-self: flex-end; 
            border-bottom-right-radius: 4px;
        }

        .msg.stranger { 
            background: #252528; 
            align-self: flex-start; 
            border-bottom-left-radius: 4px;
        }
        
        /* Input sáv */
        #input-area { 
            padding: 10px 12px; 
            background: #1c1c1e; 
            display: flex; 
            gap: 8px; 
            align-items: center;
            border-top: 1px solid #2c2c2e;
            flex-shrink: 0;
            padding-bottom: calc(10px + env(safe-area-inset-bottom)); 
        }

        input { 
            flex: 1; 
            padding: 12px 16px; 
            border-radius: 24px; 
            border: none; 
            background: #2c2c2e; 
            color: white; 
            font-size: 16px; 
            outline: none;
        }

        button { 
            padding: 12px 20px; 
            border: none; 
            border-radius: 24px; 
            font-weight: bold; 
            cursor: pointer;
            font-size: 15px;
        }

        #next-btn { background: #ff3b30; color: white; }
        #send-btn { background: #34c759; color: white; }
        #send-btn:disabled { background: #1e3d24; color: #666; }
    </style>
</head>
<body>

    <div id="permission-overlay">
        <h2>Omegle Video</h2>
        <p>A beszélgetés indításához engedélyezned kell a kamerát és a mikrofont.</p>
        <button id="grant-camera-btn">Kamera indítása 📹</button>
    </div>

    <div id="main-container">
        <div id="video-container">
            <div class="video-wrapper">
                <video id="remote-video" autoplay playsinline></video>
                <div class="video-label">Idegen</div>
            </div>
            <div class="video-wrapper">
                <video id="local-video" autoplay muted playsinline></video>
                <div class="video-label">Te</div>
            </div>
        </div>

        <div id="chat-container">
            <div id="chat-box"></div>
            <div id="input-area">
                <button id="next-btn">Next</button>
                <input type="text" id="msg-input" placeholder="Üzenet..." disabled autocomplete="off">
                <button id="send-btn" disabled>Küldés</button>
            </div>
        </div>
    </div>

    <script>
        let ws;
        let localStream;
        let peerConnection;
        
        // Ingyenes Google STUN szerver. Ha mobilnetről teszteled és nem kapcsol össze, ide kell TURN szerver!
        const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        const localVideo = document.getElementById('local-video');
        const remoteVideo = document.getElementById('remote-video');
        const chatBox = document.getElementById('chat-box');
        const msgInput = document.getElementById('msg-input');
        const sendBtn = document.getElementById('send-btn');
        const nextBtn = document.getElementById('next-btn');
        const overlay = document.getElementById('permission-overlay');
        const grantBtn = document.getElementById('grant-camera-btn');

        grantBtn.addEventListener('click', async () => {
            const hasCam = await initCamera();
            if (hasCam) {
                overlay.style.display = 'none';
                connect();
            }
        });

        async function initCamera() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                alert("⚠️ Biztonsági hiba: A kamera eléréséhez HTTPS kapcsolat szükséges! Renderre feltöltve jó lesz.");
                return false;
            }
            if (!localStream) {
                try {
                    localStream = await navigator.mediaDevices.getUserMedia({ 
                        video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } }, 
                        audio: true 
                    });
                    localVideo.srcObject = localStream;
                } catch (err) {
                    alert("Nem sikerült hozzáférni a kamerához: " + err.message);
                    return false;
                }
            }
            return true;
        }

        async function connect() {
            if (!localStream) return;
            if (peerConnection) { peerConnection.close(); peerConnection = null; }
            if (ws) ws.close();

            chatBox.innerHTML = '';
            remoteVideo.srcObject = null;
            appendMessage('status', 'Keresés...');

            // Dinamikusan kitalálja, hogy ws:// vagy wss:// kell (Renderen automatikusan wss:// lesz)
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const host = window.location.host;
            
            ws = new WebSocket(`${protocol}//${host}`);

            ws.onmessage = async (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'status') {
                    appendMessage('status', data.text);
                    if (data.initRTC) setupWebRTC(true);
                } else if (data.type === 'offer') {
                    setupWebRTC(false);
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(data));
                    const answer = await peerConnection.createAnswer();
                    await peerConnection.setLocalDescription(answer);
                    ws.send(JSON.stringify({ type: 'answer', sdp: answer.sdp, type: answer.type }));
                } else if (data.type === 'answer') {
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(data));
                } else if (data.type === 'candidate') {
                    if (peerConnection) await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
                } else if (data.type === 'chat') {
                    appendMessage('stranger', 'Idegen: ' + data.text);
                }
            };
        }

        async function setupWebRTC(isCaller) {
            peerConnection = new RTCPeerConnection(rtcConfig);
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

            peerConnection.ontrack = (event) => {
                if (event.streams && event.streams[0]) {
                    remoteVideo.srcObject = event.streams[0];
                    msgInput.disabled = false;
                    sendBtn.disabled = false;
                }
            };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) ws.send(JSON.stringify({ type: 'candidate', candidate: event.candidate }));
            };

            if (isCaller) {
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                ws.send(JSON.stringify({ type: 'offer', sdp: offer.sdp, type: offer.type }));
            }
        }

        function sendMessage() {
            const text = msgInput.value.trim();
            if (!text) return;
            ws.send(JSON.stringify({ type: 'chat', text: text }));
            appendMessage('me', 'Én: ' + text);
            msgInput.value = '';
        }

        function appendMessage(type, text) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('msg', type);
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        sendBtn.addEventListener('click', sendMessage);
        msgInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
        nextBtn.addEventListener('click', connect);
    </script>
</body>
</html>
